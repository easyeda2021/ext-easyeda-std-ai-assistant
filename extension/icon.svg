<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3f73"/>
      <stop offset="1" stop-color="#0e1e36"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a5f0ff"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#tile)"/>

  <!-- schematic net: three nodes joined by traces -->
  <g fill="none" stroke="url(#trace)" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.2 23.6 L16 11.4 L22.8 23.6"/>
    <path d="M12.2 18.4 H19.8"/>
  </g>
  <g fill="#0e1e36" stroke="url(#trace)" stroke-width="1.6">
    <circle cx="16" cy="11.4" r="2.3"/>
    <circle cx="9.2" cy="23.6" r="2"/>
    <circle cx="22.8" cy="23.6" r="2"/>
  </g>

  <!-- AI spark -->
  <path d="M23.6 3.4 l1.05 2.75 2.75 1.05 -2.75 1.05 -1.05 2.75
           -1.05 -2.75 -2.75 -1.05 2.75 -1.05z" fill="#ffc24d"/>
</svg>
